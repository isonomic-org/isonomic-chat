name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: isonomic-org/.github/.github/workflows/rust-ci.yml@main
    secrets: inherit
    with:
      linux-gui-libs: true
      ui: true
      features: --all-features --locked
