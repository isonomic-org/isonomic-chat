[package]
name = "isonomic-chat"
description = "Isonomic Chat: the app the window mounts, with its screens, navigation, home, settings and preset."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The SDK's TestHost builds a multi-threaded runtime, but isonomic-app does
# not ask tokio for one (requests O6 in docs/requests.md).
test-support = [
    "ui/test-support",
    "conversation-ui/test-support",
    "isonomic-app/test-support",
    "dep:tokio",
]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
conversation-host.workspace = true
conversation-sdk.workspace = true
conversation-ui.workspace = true
isonomic-app.workspace = true
isonomic-proto.workspace = true
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }
ui.workspace = true

[dev-dependencies]
conversation-model.workspace = true
isonomic-app = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Offscreen screenshots of the shell and home, light and dark. Opt-in: needs a
# GPU or a software Vulkan adapter.
[[test]]
name = "screenshots"
harness = false
test = false
required-features = ["test-support"]
