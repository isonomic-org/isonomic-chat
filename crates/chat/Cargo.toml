[package]
name = "chat"
description = "Isonomic Chat: screens, navigation, home, settings and preset."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-support = ["ui/test-support", "conversation-ui/test-support"]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
conversation-host.workspace = true
conversation-ui.workspace = true
ui.workspace = true

[dev-dependencies]
conversation-model.workspace = true
ui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Offscreen screenshots of the shell and home, light and dark. Opt-in: needs a
# GPU or a software Vulkan adapter.
[[test]]
name = "screenshots"
harness = false
test = false
required-features = ["test-support"]
