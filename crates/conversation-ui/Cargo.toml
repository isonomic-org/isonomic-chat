[package]
name = "conversation-ui"
description = "The conversation kit's bindings to Isonomic UI: the conversation view, its composer and its turns."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-support = ["ui/test-support"]

[dependencies]
conversation-host.workspace = true
conversation-model.workspace = true
futures.workspace = true
ui.workspace = true

[dev-dependencies]
harness-testkit.workspace = true
serde_json.workspace = true
ui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# The kit's gallery: every recorded fixture through the conversation view,
# light and dark, drawn offscreen. Opt-in: needs a GPU or a software Vulkan
# adapter.
[[test]]
name = "gallery"
harness = false
test = false
required-features = ["test-support"]
